version: 2

models:
  - name: int_order_event_sequence
    description: >
      Orders the events of each order chronologically and calculates
      navigation fields, elapsed time between events, and ingestion delay.

    columns:
      - name: event_record_id
        description: Unique identifier of the event record.
        data_tests:
          - not_null
          - unique

      - name: event_id
        description: Business identifier of the event.
        data_tests:
          - not_null
          - unique

      - name: order_id
        description: Identifier of the order associated with the event.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_ecommerce__orders')
                field: order_id

      - name: event_type
        description: Type of event in the order lifecycle.
        data_tests:
          - not_null

      - name: event_time
        description: Timestamp when the event occurred.
        data_tests:
          - not_null

      - name: received_at
        description: Timestamp when the event was received by the platform.
        data_tests:
          - not_null

      - name: source_system
        description: System that generated the event.
        data_tests:
          - not_null

      - name: event_sequence_number
        description: Chronological position of the event within the order.
        data_tests:
          - not_null

      - name: previous_event_type
        description: Previous event type for the same order.

      - name: previous_event_time
        description: Timestamp of the previous event for the same order.

      - name: next_event_type
        description: Next event type for the same order.

      - name: next_event_time
        description: Timestamp of the next event for the same order.

      - name: hours_since_previous_event
        description: Hours elapsed since the previous event.

      - name: ingestion_delay_minutes
        description: Minutes elapsed between event occurrence and ingestion.




  - name: int_order_milestones
    description: >
      Consolidates the order event history into one row per order,
      with the main lifecycle milestones represented as columns.

    columns:
      - name: order_id
        description: Unique identifier of the order.
        data_tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('stg_ecommerce__orders')
                field: order_id

      - name: first_event_at
        description: Timestamp of the first recorded order event.
        data_tests:
          - not_null

      - name: last_event_at
        description: Timestamp of the latest recorded order event.
        data_tests:
          - not_null

      - name: event_count
        description: Total number of events recorded for the order.
        data_tests:
          - not_null

      - name: order_created_at
        description: Timestamp when the order was created.
        data_tests:
          - not_null

      - name: payment_approved_at
        description: Timestamp when payment was approved.

      - name: order_allocated_at
        description: Timestamp when the order was allocated to a warehouse.

      - name: picking_started_at
        description: Timestamp when the picking process started.

      - name: picking_completed_at
        description: Timestamp when the picking process was completed.

      - name: order_packed_at
        description: Timestamp when the order was packed.

      - name: order_shipped_at
        description: Timestamp when the order was shipped.

      - name: in_transit_at
        description: Timestamp when the order entered transit.

      - name: first_delivery_attempt_at
        description: Timestamp of the first delivery attempt.

      - name: last_delivery_attempt_at
        description: Timestamp of the latest delivery attempt.

      - name: delivery_attempt_count
        description: Number of delivery attempts recorded for the order.
        data_tests:
          - not_null

      - name: order_delivered_at
        description: Timestamp when the order was delivered.

      - name: order_cancelled_at
        description: Timestamp when the order was cancelled.    




  - name: int_order_lifecycle
    description: >
      Represents the complete lifecycle of each order, including its
      milestones, stage durations, current stage, and delay indicators.

    columns:
      - name: order_id
        description: Unique identifier of the order.
        data_tests:
          - not_null
          - unique

      - name: order_number
        description: Business identifier of the order.
        data_tests:
          - not_null
          - unique

      - name: current_stage
        description: Current operational stage of the order.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - created
                  - payment_pending
                  - paid
                  - allocated
                  - picking
                  - picked
                  - packed
                  - shipped
                  - in_transit
                  - delivered
                  - cancelled

      - name: promised_delivery_at
        description: Timestamp promised to the customer for delivery.
        data_tests:
          - not_null

      - name: order_created_at
        description: Timestamp when the order lifecycle started.
        data_tests:
          - not_null

      - name: current_stage_started_at
        description: Timestamp when the current stage started.
        data_tests:
          - not_null

      - name: event_count
        description: Total number of events associated with the order.
        data_tests:
          - not_null

      - name: total_cycle_hours
        description: Total elapsed hours since order creation.
        data_tests:
          - not_null

      - name: is_late
        description: Indicates whether the order was or currently is late.

      - name: is_completed
        description: Indicates whether the order was delivered.
        data_tests:
          - not_null

      - name: is_cancelled
        description: Indicates whether the order was cancelled.
        data_tests:
          - not_null  




  - name: int_order_fulfillment
    description: >
      Compares ordered, shipped, and delivered quantities for each order
      and calculates fulfillment, on-time, and OTIF indicators.

    columns:
      - name: order_id
        description: Unique identifier of the order.
        data_tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('stg_ecommerce__orders')
                field: order_id

      - name: ordered_quantity
        description: Total quantity ordered.
        data_tests:
          - not_null

      - name: shipped_quantity
        description: Total quantity shipped.
        data_tests:
          - not_null

      - name: delivered_quantity
        description: Total quantity delivered.
        data_tests:
          - not_null

      - name: unfulfilled_quantity
        description: Quantity that has not been delivered.
        data_tests:
          - not_null

      - name: fulfillment_rate_percentage
        description: Percentage of the ordered quantity that was delivered.

      - name: is_fully_shipped
        description: Indicates whether the complete order was shipped.
        data_tests:
          - not_null

      - name: has_partial_delivery
        description: Indicates whether the order was partially delivered.
        data_tests:
          - not_null

      - name: is_in_full
        description: Indicates whether a delivered order was delivered completely.

      - name: is_on_time
        description: Indicates whether a delivered order met its promised date.

      - name: is_otif
        description: Indicates whether an order was delivered on time and in full.              




  - name: int_order_items_enriched
    description: >
      Enriches order items with product and order attributes and calculates
      gross value, net value, discount percentage, and total weight.

    columns:
      - name: order_item_id
        description: Unique identifier of the order item.
        data_tests:
          - not_null
          - unique

      - name: order_id
        description: Identifier of the related order.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_ecommerce__orders')
                field: order_id

      - name: product_id
        description: Identifier of the related product.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_ecommerce__products')
                field: product_id

      - name: sku
        description: Product stock keeping unit.
        data_tests:
          - not_null

      - name: quantity
        description: Quantity ordered.
        data_tests:
          - not_null

      - name: sale_unit_price
        description: Unit price recorded when the order was created.
        data_tests:
          - not_null

      - name: gross_line_amount
        description: Item value before discount.
        data_tests:
          - not_null

      - name: net_line_amount
        description: Item value after discount.
        data_tests:
          - not_null

      - name: discount_percentage
        description: Percentage discount applied to the item.

      - name: total_weight_kg
        description: Total item weight based on quantity.
        data_tests:
          - not_null    




  - name: int_order_payment_summary
    description: >
      Summarizes payment attempts into one row per order and identifies
      the latest payment status and whether payment was approved.

    columns:
      - name: order_id
        description: Unique identifier of the order.
        data_tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('stg_ecommerce__orders')
                field: order_id

      - name: payment_attempt_count
        description: Total number of payment attempts.
        data_tests:
          - not_null

      - name: declined_attempt_count
        description: Number of declined payment attempts.
        data_tests:
          - not_null

      - name: latest_payment_reference
        description: Reference of the latest payment attempt.
        data_tests:
          - not_null

      - name: latest_payment_status
        description: Status of the latest payment attempt.
        data_tests:
          - not_null

      - name: latest_payment_method
        description: Method used in the latest payment attempt.
        data_tests:
          - not_null

      - name: latest_payment_amount
        description: Amount of the latest payment attempt.
        data_tests:
          - not_null

      - name: has_approved_payment
        description: Indicates whether the order has an approved payment.
        data_tests:
          - not_null




  - name: int_order_stage_history
    description: >
      Represents the stages reached by each order. The model has one row
      per order and stage, containing stage timestamps, duration, aging
      and operational status.
    columns:
      - name: order_id
        description: Unique identifier of the order.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_ecommerce__orders')
                field: order_id

      - name: order_number
        description: Business identifier of the order.
        data_tests:
          - not_null

      - name: customer_id
        description: Identifier of the customer responsible for the order.
        data_tests:
          - not_null

      - name: warehouse_id
        description: Identifier of the warehouse responsible for fulfillment.

      - name: service_level
        description: Service level contracted for the order.
        data_tests:
          - not_null

      - name: promised_delivery_at
        description: Promised delivery timestamp.
        data_tests:
          - not_null

      - name: order_current_stage
        description: Current operational stage recorded for the order.

      - name: stage_sequence
        description: Numerical sequence of the stage in the order flow.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5, 6]

      - name: stage_code
        description: Standardized code identifying the stage.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - entry
                  - payment
                  - preparation
                  - dispatch
                  - transport
                  - delivery

      - name: stage_name
        description: Business-friendly name of the stage.
        data_tests:
          - not_null

      - name: stage_started_at
        description: Timestamp when the order entered the stage.
        data_tests:
          - not_null

      - name: stage_finished_at
        description: Timestamp when the order completed or left the stage.

      - name: stage_duration_hours
        description: Total number of hours spent in a completed or cancelled stage.

      - name: stage_age_hours
        description: Number of hours the order has remained in its current stage.

      - name: stage_status
        description: Indicates whether the stage is completed, current or cancelled.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - completed
                  - current
                  - cancelled

      - name: is_completed_stage
        description: Indicates whether the stage was completed normally.
        data_tests:
          - not_null

      - name: is_current_stage
        description: Indicates whether this is the current stage of the order.
        data_tests:
          - not_null

      - name: is_cancelled_in_stage
        description: Indicates whether the order was cancelled during the stage.
        data_tests:
          - not_null

      - name: is_late
        description: > 
          Indicates whether an active or delivered order is late.
          Null when the order was cancelled.

      - name: order_delivered_at
        description: Timestamp when the order was delivered.

      - name: order_cancelled_at
        description: Timestamp when the order was cancelled.




  - name: int_stage_benchmarks
    description: >
      Historical duration benchmarks for completed operational stages,
      grouped by stage and service level.
    columns:
      - name: stage_sequence
        description: Numerical position of the stage in the order flow.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5]

      - name: stage_code
        description: Standardized stage identifier.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - entry
                  - payment
                  - preparation
                  - dispatch
                  - transport

      - name: stage_name
        description: Business-friendly stage name.
        data_tests:
          - not_null

      - name: service_level
        description: Service level used to segment the benchmark.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - standard
                  - express
                  - priority

      - name: completed_stage_count
        description: Number of completed stages used in the calculation.
        data_tests:
          - not_null

      - name: average_duration_hours
        description: Average historical duration of the stage in hours.
        data_tests:
          - not_null

      - name: median_duration_hours
        description: Median historical duration of the stage in hours.
        data_tests:
          - not_null

      - name: p75_duration_hours
        description: Duration within which 75 percent of stages were completed.
        data_tests:
          - not_null

      - name: p90_duration_hours
        description: Duration within which 90 percent of stages were completed.
        data_tests:
          - not_null

      - name: critical_threshold_hours
        description: Critical threshold calculated as 1.25 times the average duration.
        data_tests:
          - not_null